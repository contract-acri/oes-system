<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · ACRI OES</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#63B72D;--green-d:#4C9420;--green-bg:#EEF7E8;--blue:#166FB1;--navy:#0B2E4F;--ink:#1B2733;--muted:#5D6B7A;--line:#DDE6E1;--bg:#F4F8F5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}
header img{width:38px;height:38px}
.org{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--blue)}
.app{font-family:Montserrat,sans-serif;font-weight:800;font-size:17px;color:var(--navy)}
.stripe{height:3px;background:linear-gradient(90deg,var(--blue),var(--green))}
main{max-width:720px;margin:0 auto;padding:40px 16px 60px}
h1{font-family:Montserrat,sans-serif;color:var(--navy);font-size:clamp(24px,4vw,30px);margin:0 0 8px;letter-spacing:-.01em}
p.lead{color:var(--muted);margin:0 0 28px;font-size:15.5px;max-width:600px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
main a{color:var(--blue)}
a.tile{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
a.tile:hover{border-color:var(--green);transform:translateY(-2px)}
a.tile b{display:block;font-family:Montserrat,sans-serif;color:var(--navy);font-size:17px;margin-bottom:6px}
a.tile span{color:var(--muted);font-size:14px;line-height:1.5}
a.tile i{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--blue);margin-top:12px}
.foot{color:var(--muted);font-size:12.5px;margin-top:36px;text-align:center}
.btn{display:inline-block;background:var(--green);color:#fff;font-weight:700;border-radius:10px;padding:11px 20px;text-decoration:none}
</style>
</head>
<body>
<header><img src="__EMBLEM__" alt="ACRI"><div><div class="org">Ahmedabad Centre for Research &amp; Innovation</div><div class="app">Online Examination System</div></div></header><div class="stripe"></div>
<main style="text-align:center">
<h1>Page not found</h1>
<p class="lead" style="margin:0 auto 24px">This address does not exist. Students start their exam on the home page.</p>
<a class="btn" href="/">Go to the exam page</a>
<p class="foot"><a href="/staff/">Staff portals</a></p>
</main>
</body>
</html>
