<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACRI Online Examination</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#63B72D; --green-2:#79BD28; --green-d:#4C9420; --green-bg:#EEF7E8;
  --blue:#166FB1; --blue-l:#3F9FCF; --blue-d:#0E568C; --navy:#0B2E4F; --blue-bg:#EAF3FA;
  --ink:#1B2733; --muted:#5D6B7A; --line:#DDE6E1; --bg:#F4F8F5; --card:#FFFFFF;
  --red:#C8372D; --red-bg:#FCECEA; --amber:#B86E00; --amber-bg:#FFF4E0;
  --r:14px; --shadow:0 1px 2px rgba(11,46,79,.06),0 6px 24px rgba(11,46,79,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;color:var(--navy);margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:#fff}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:46px;height:46px;flex:none}
.org{font-family:Montserrat,sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.app{font-family:Montserrat,sans-serif;font-weight:800;font-size:18px;color:var(--navy);line-height:1.15}
.stripe{height:4px;background:linear-gradient(90deg,var(--blue) 0%,var(--blue-l) 45%,var(--green) 100%)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 48px}
.narrow{max-width:760px}
.hero{padding:6px 0 18px}
.hero h1{font-size:30px;font-weight:800}
.hero p{color:var(--muted);margin:6px 0 0;max-width:560px}
.grid2{display:grid;grid-template-columns:1.25fr .85fr;gap:20px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card+.card{margin-top:18px}
.eyebrow{font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-d);margin-bottom:6px}
label.f{display:block;font-weight:600;font-size:13px;color:var(--navy);margin:14px 0 6px}
.in{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.in:focus{border-color:var(--blue-l);box-shadow:0 0 0 3px rgba(63,159,207,.18)}
.code{text-transform:uppercase;letter-spacing:.18em;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--blue);color:#fff;transition:background .15s,transform .05s}
.btn:hover{background:var(--blue-d)} .btn:active{transform:translateY(1px)}
.btn:disabled{background:#AEBBC6;cursor:not-allowed}
.btn.green{background:var(--green-d)} .btn.green:hover{background:#3F7E19}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line)} .btn.ghost:hover{border-color:var(--blue-l);background:var(--blue-bg)}
.btn.red{background:var(--red)}
.btn.block{width:100%;margin-top:18px;padding:13px}
.err{display:none;margin-top:14px;padding:10px 13px;border-radius:10px;background:var(--red-bg);color:var(--red);font-size:14px}
.ok{padding:10px 13px;border-radius:10px;background:var(--green-bg);color:var(--green-d);font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tips ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.tips li{margin:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--blue-bg);color:var(--blue-d)}
.chip.g{background:var(--green-bg);color:var(--green-d)}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.meta div{background:var(--bg);border-radius:10px;padding:10px 12px}
.meta b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.state{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.state.live{background:var(--green-bg);color:var(--green-d)} .state.upcoming{background:var(--amber-bg);color:var(--amber)} .state.closed,.state.off{background:#EEF1F4;color:var(--muted)}
.instr{white-space:pre-wrap;background:var(--bg);border-left:4px solid var(--green);border-radius:8px;padding:12px 14px;margin:14px 0;font-size:14px}
.checks{list-style:none;padding:0;margin:16px 0}
.checks li{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.checks li:last-child{border-bottom:1px solid var(--line)}
.dot{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:#EEF1F4;color:var(--muted)}
.dot.done{background:var(--green);color:#fff}
.checks .t{flex:1;min-width:0}
.checks .t>b{display:block;color:var(--navy)}
.prev{width:120px;height:90px;border-radius:8px;background:#0B2E4F;object-fit:cover;display:none}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px}
.agree input{margin-top:4px;width:18px;height:18px;accent-color:var(--green-d)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}

/* ---------- exam shell ---------- */
.shell{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);user-select:none;-webkit-user-select:none}
.etop{display:flex;align-items:center;gap:16px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
.etop .brand img{width:38px;height:38px}
.etitle{font-family:Montserrat,sans-serif;font-weight:700;color:var(--navy);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.esub{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.timer{font-family:Montserrat,sans-serif;font-weight:800;font-size:22px;color:var(--navy);background:var(--blue-bg);padding:6px 14px;border-radius:10px;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--amber-bg);color:var(--amber)} .timer.crit{background:var(--red-bg);color:var(--red)}
.mini{width:84px;height:63px;border-radius:8px;object-fit:cover;background:var(--navy);border:2px solid var(--green)}
.vbadge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--green-bg);color:var(--green-d);white-space:nowrap}
.vbadge.bad{background:var(--red-bg);color:var(--red)}
.net{font-size:12px;color:var(--red);font-weight:600;display:none}
.ebody{flex:1;display:grid;grid-template-columns:250px 1fr;min-height:0}
.pal{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column}
.pal h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pgrid button{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--muted);font-size:13px;position:relative}
.pgrid button.ans{background:var(--green);border-color:var(--green);color:#fff}
.pgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#E59A00}
.pgrid button.cur{outline:3px solid var(--blue-l);outline-offset:1px}
.legend{font-size:12px;color:var(--muted);margin:14px 0;display:grid;gap:5px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pal .btn{margin-top:auto}
.qpane{overflow:auto;padding:26px 30px 40px;position:relative}
.qcard{max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.qnum{font-family:Montserrat,sans-serif;font-weight:800;color:var(--blue)}
.qtext{font-size:17px;line-height:1.6;white-space:pre-wrap;color:var(--ink);margin-bottom:18px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1.5px solid var(--line);border-radius:11px;margin:9px 0;cursor:pointer;transition:border .12s,background .12s}
.opt:hover{border-color:var(--blue-l)}
.opt.sel{border-color:var(--green);background:var(--green-bg)}
.opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--green-d)}
.opt .L{font-weight:700;color:var(--blue);min-width:18px}
textarea.ans{width:100%;min-height:260px;resize:vertical;padding:14px;border:1.5px solid var(--line);border-radius:11px;line-height:1.6;user-select:text;-webkit-user-select:text;outline:none}
textarea.ans:focus{border-color:var(--blue-l);box-shadow:0 0 0 3px rgba(63,159,207,.15)}
.wc{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.wm{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.05;overflow:hidden;font-family:Montserrat,sans-serif;font-weight:700;font-size:15px;color:var(--navy);line-height:110px;transform:rotate(-24deg) scale(1.4);white-space:nowrap}
.shell.blocked .ebody{filter:blur(9px);pointer-events:none}
@media (max-width:760px){.ebody{grid-template-columns:1fr}.pal{display:none}.qpane{padding:16px}.mini{display:none}}

.ov{position:fixed;inset:0;background:rgba(11,46,79,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.on{display:flex}
.box{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
.box h2{font-size:21px;margin:8px 0}
.box p{color:var(--muted);margin:8px 0 16px}
.box .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ic{width:54px;height:54px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:26px;font-weight:800}
.ic.r{background:var(--red-bg);color:var(--red)} .ic.g{background:var(--green-bg);color:var(--green-d)} .ic.b{background:var(--blue-bg);color:var(--blue)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.spin.dk{border-color:rgba(22,111,177,.25);border-top-color:var(--blue);width:34px;height:34px;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hidev{position:fixed;left:-10px;top:-10px;width:2px;height:2px;opacity:0;pointer-events:none}
.timer.paused{background:#EEF1F4;color:var(--muted)}
/* ---------- pause screen ---------- */
.pv{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 10%,#14406B 0%,#0B2E4F 55%,#081F36 100%);color:#F5F8F4;overflow:auto}
.pv.on{display:flex}
.pvb{max-width:880px;width:100%;text-align:center}
.pvb img{width:84px;height:84px;background:#F5F8F4;border-radius:50%;padding:8px}
.pv .eb{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#9FD07A;font-size:13px;margin-top:16px}
.pv h1{color:#F5F8F4;font-size:clamp(26px,4vw,40px);font-weight:800;line-height:1.15;margin:10px auto 10px;max-width:760px}
.pv p.lead{color:#BFD3E4;font-size:17px;max-width:640px;margin:0 auto}
.pvs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0}
@media (max-width:700px){.pvs{grid-template-columns:1fr}}
.pvs div{background:rgba(245,248,244,.07);border:1px solid rgba(245,248,244,.16);border-radius:16px;padding:18px 12px}
.pvs b{display:block;font-family:Montserrat,sans-serif;font-size:34px;font-weight:800;color:#F5F8F4;font-variant-numeric:tabular-nums;line-height:1.15}
.pvs span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9FB3C5;font-weight:700;margin-bottom:6px}
.pvs small{display:block;color:#BFD3E4;font-size:13px;margin-top:6px}
.pvn{background:rgba(99,183,45,.14);border:1px solid rgba(159,208,122,.45);border-radius:14px;padding:14px 18px;font-size:15px;color:#E4F3D8;text-align:left;display:flex;gap:12px;align-items:flex-start}
.pvn.alert{background:#B86E00;border-color:#FFD08A;color:#fff;animation:pvp 1s ease-in-out infinite}
@keyframes pvp{50%{filter:brightness(1.25)}}
.pvm{margin-top:14px;background:rgba(245,248,244,.1);border-radius:12px;padding:12px 16px;color:#F5F8F4;font-size:15px;text-align:left}
.pvf{margin-top:18px;font-size:13px;color:#9FB3C5}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov"><div class="box" id="ovbox"></div></div>
<div class="toast" id="toast"></div>
<div class="pv" id="pv" role="alertdialog" aria-live="assertive"></div>

<script>
/* ==========================================================================
   ACRI Online Examination — student page (oes.acriindia.org.in/)
   The Apps Script /exec URL comes from /config.js.
   ========================================================================== */
const API_URL = window.ACRI_API_URL || 'PASTE_YOUR_WEB_APP_EXEC_URL_HERE';
const EMBLEM = '__EMBLEM__';

// The page is served directly (not inside an embed), so the exam runs in this same tab.
let BOOT = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let clockOffset = 0;   // server time − local time
const now = () => Date.now() + clockOffset;

async function api(action, data) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data || {})) });
  const j = await res.json();
  if (j.serverTime) clockOffset = j.serverTime - Date.now();
  if (!j.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}

function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms || 2200);
}
function overlay(html) { $('#ovbox').innerHTML = html; $('#ov').classList.add('on'); }
function closeOverlay() { $('#ov').classList.remove('on'); }
function header(right) {
  return `<header class="top"><div class="brand"><img src="${EMBLEM}" alt="ACRI"><div><div class="org">Ahmedabad Centre for Research &amp; Innovation</div><div class="app">Online Examinations</div></div></div><div>${right || ''}</div></header><div class="stripe"></div>`;
}
function showErr(id, msg) { const e = $(id); if (!e) return; e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }

/* ============================ LANDING (inside Google Sites) ============================ */

let INFO = null, STUDENT = null;

function landing() {
  document.title = 'ACRI Online Examination';
  $('#app').innerHTML = header() + `
  <main class="wrap">
    <section class="hero"><div class="eyebrow">Office of the Controller of Examinations</div>
      <h1>Sit your examination</h1>
      <p>Enter your details and the access code from your invigilator. Your exam opens in its own secure window.</p></section>
    <div class="grid2">
      <div>
        <section class="card" id="formCard">
          <label class="f" for="nm">Full name</label><input class="in" id="nm" autocomplete="name" placeholder="As it should appear on your result">
          <label class="f" for="em">Email address</label><input class="in" id="em" type="email" autocomplete="email" placeholder="you@example.com">
          <label class="f" for="cd">Exam access code</label><input class="in code" id="cd" autocomplete="off" placeholder="e.g. ACRI-SBMC-01">
          <button class="btn block" id="go">Continue</button>
          <div class="err" id="e1"></div>
        </section>
        <section id="examCard"></section>
      </div>
      <aside class="card tips">
        <div class="eyebrow">Before you begin</div>
        <h3 style="font-size:17px">Getting ready</h3>
        <ul>
          <li>Use <b>Google Chrome or Microsoft Edge</b> on a laptop or desktop.</li>
          <li><b>Allow pop-ups</b> for this site — the exam opens in a new tab.</li>
          <li>Keep your webcam on and your face clearly visible, if required.</li>
          <li>When asked to share your screen, choose <b>Entire screen</b>.</li>
          <li>Do not switch tabs, leave fullscreen, or open other apps. Every switch is recorded.</li>
          <li>Copy, paste and keyboard shortcuts are disabled.</li>
          <li>The exam submits automatically when time runs out.</li>
          <li>One attempt per email address.</li>
        </ul>
      </aside>
    </div>
    <div class="foot">Ahmedabad Centre for Research and Innovation · Online Examination System</div>
  </main>`;
  $('#go').onclick = checkCode;
  ['#nm', '#em', '#cd'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') checkCode(); }));
}

async function checkCode() {
  const name = $('#nm').value.trim().replace(/\s+/g, ' '), email = $('#em').value.trim().toLowerCase(), code = $('#cd').value.trim().toUpperCase();
  showErr('#e1', '');
  if (name.length < 2) return showErr('#e1', 'Please enter your full name.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('#e1', 'Please enter a valid email address.');
  if (!code) return showErr('#e1', 'Please enter the exam access code.');
  const b = $('#go'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Checking…';
  try {
    const r = await api('examInfo', { code });
    INFO = r.exam; STUDENT = { name, email, code };
    renderExamCard();
  } catch (e) { showErr('#e1', e.message); }
  b.disabled = false; b.textContent = 'Continue';
}

function renderExamCard() {
  const x = INFO;
  const stLabel = { live: 'Open now', upcoming: 'Not open yet', closed: 'Closed', off: 'Not available' }[x.state];
  const req = [];
  if (x.camera) req.push('Webcam'); if (x.screen) req.push('Entire-screen sharing'); if (x.fullscreen) req.push('Fullscreen');
  req.push('Tab-switch monitoring', 'Copy/paste blocked');
  let action = '';
  if (x.state === 'live') action = `<button class="btn green block" id="launch">Continue to system check</button>
     <p class="small muted" style="text-align:center;margin:10px 0 0">Next you will allow your camera${x.screen ? ', share your screen' : ''} and start the exam.</p>`;
  else if (x.state === 'upcoming') action = `<div class="ok" style="background:var(--amber-bg);color:var(--amber);margin-top:16px">This exam opens at <b>${esc(x.startIST)} IST</b>. <span id="cdn"></span></div><button class="btn ghost block" id="recheck">Check again</button>`;
  else action = `<div class="err" style="display:block">${x.state === 'closed' ? 'This exam closed at ' + esc(x.endIST) + ' IST.' : 'This exam is not available right now.'}</div>`;
  $('#examCard').innerHTML = `<div class="card" style="margin-top:18px">
    <div class="eyebrow">Your examination</div>
    <h2 style="font-size:22px">${esc(x.title)}<span class="state ${x.state}">${stLabel}</span></h2>
    ${x.description ? `<p class="muted" style="margin:8px 0 0;white-space:pre-wrap">${esc(x.description)}</p>` : ''}
    <div class="meta">
      <div><b>Opens (IST)</b>${esc(x.startIST)}</div><div><b>Closes (IST)</b>${esc(x.endIST)}</div>
      <div><b>Duration</b>${x.duration ? x.duration + ' minutes' : 'Until the exam closes'}</div><div><b>Questions · Marks</b>${x.questionCount} · ${x.totalMarks}</div>
    </div>
    ${x.registeredOnly ? `<div class="ok" style="margin-bottom:12px">Registered candidates only — use the email address your <b>admit card</b> was sent to. Your roll number appears once you start.</div>` : ''}
    <div class="small muted" style="font-weight:600">Proctoring</div>
    <div class="chips">${req.map((r, i) => `<span class="chip ${i < 3 ? '' : 'g'}">${esc(r)}</span>`).join('')}</div>
    ${action}<div class="err" id="e2"></div></div>`;
  if ($('#launch')) $('#launch').onclick = launch;
  if ($('#recheck')) $('#recheck').onclick = checkCode;
  if (x.state === 'upcoming') {
    clearInterval(renderExamCard.t);
    renderExamCard.t = setInterval(() => {
      const el = $('#cdn'); if (!el) return clearInterval(renderExamCard.t);
      const s = Math.max(0, Math.floor((x.start - now()) / 1000));
      el.textContent = 'Starts in ' + fmtDur(s) + '.';
      if (s <= 0) { clearInterval(renderExamCard.t); checkCode(); }
    }, 1000);
  }
}

function launch() {
  clearInterval(renderExamCard.t);
  BOOT = { student: STUDENT, info: INFO };
  window.scrollTo(0, 0);
  secureTab();
}

function fmtDur(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}

const S = {

  suspendFocus: false, liveSeconds: 5, snapshotSeconds: 60, warned5: false, warned1: false, lastSnap: 0,
  paused: false, pause: null, graceUntil: 0, watch: false, hbSeconds: 30, lastNotice: '', lastLat: 0, fails: 0, audio: null
};
const P = { cam: null, scr: null, camV: null, scrV: null, canvas: document.createElement('canvas') };

function liveTrack(stream) { const t = stream && stream.getVideoTracks()[0]; return !!(t && t.readyState === 'live'); }
function checkReady() {
  const x = S.exam;
  const ok = $('#agree').checked && (!x.camera || liveTrack(P.cam)) && (!x.screen || liveTrack(P.scr));
  $('#bStart').disabled = !ok;
}

function hiddenVideo(stream) {
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.autoplay = true; v.className = 'hidev'; v.srcObject = stream;
  document.body.appendChild(v); v.play().catch(() => {});
  return v;
}

async function enableCamera() {
  try {
    S.suspendFocus = true;
    const s = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false });
    if (P.cam) P.cam.getTracks().forEach(t => t.stop());
    P.cam = s;
    if (P.camV) P.camV.remove();
    P.camV = hiddenVideo(s);
    s.getVideoTracks()[0].addEventListener('ended', () => mediaLost('camera'));
    const m = $('#mini'); if (m) m.srcObject = s;
    return true;
  } catch (e) {
    showErr('#e3', 'Camera access was blocked (' + (e.name || e.message) + '). Click the camera icon in the address bar, allow access, and try again.');
    return false;
  } finally { setTimeout(() => S.suspendFocus = false, 800); }
}

async function enableScreen() {
  try {
    S.suspendFocus = true;
    const s = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'monitor', frameRate: { ideal: 5, max: 10 } }, audio: false,
      monitorTypeSurfaces: 'include', selfBrowserSurface: 'exclude', surfaceSwitching: 'exclude', systemAudio: 'exclude'
    });
    const tr = s.getVideoTracks()[0];
    const surf = tr.getSettings ? tr.getSettings().displaySurface : '';
    if (surf && surf !== 'monitor') {
      s.getTracks().forEach(t => t.stop());
      throw new Error('Please choose "Entire screen" — sharing a window or a tab is not accepted.');
    }
    if (P.scr) P.scr.getTracks().forEach(t => t.stop());
    P.scr = s;
    if (P.scrV) P.scrV.remove();
    P.scrV = hiddenVideo(s);
    tr.addEventListener('ended', () => mediaLost('screen'));
    return true;
  } catch (e) {
    const msg = e.name === 'NotAllowedError' ? 'Screen sharing was cancelled or blocked. Click again and choose "Entire screen".' : (e.message || 'Screen sharing failed.');
    showErr('#e3', msg); toast(msg, 3500);
    return false;
  } finally { setTimeout(() => S.suspendFocus = false, 1200); }
}

async function beginExam() {
  const x = S.exam, st = BOOT.student;
  showErr('#e3', '');
  if (x.fullscreen) {
    try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); }
    catch (e) { return showErr('#e3', 'Fullscreen was blocked by the browser. Please try again.'); }
  }
  unlockAudio();
  const b = $('#bStart'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Starting…';
  try {
    let r = null;
    for (let tries = 0; ; tries++) {
      try { r = await api('startAttempt', { code: st.code, name: st.name, email: st.email, ua: navigator.userAgent }); break; }
      catch (err) {
        if (!/server is busy|Failed to fetch|NetworkError/i.test(err.message) || tries >= 12) throw err;
        b.innerHTML = '<span class="spin"></span> Many students are joining — you are in the queue…';
        await sleep(2000 + Math.random() * 4000 + tries * 1000);
      }
    }
    st.name = r.name || st.name; S.rollNo = r.rollNo || '';
    Object.assign(S, { attemptId: r.attemptId, token: r.token, questions: r.questions, deadline: r.deadline, violations: r.violations, liveSeconds: r.liveSeconds, snapshotSeconds: r.snapshotSeconds, hbSeconds: r.heartbeatSeconds || 30 });
    S.exam = Object.assign({}, x, r.exam);
    S.answers = Object.assign({}, r.draft || {}, readLocal());
    renderExam();
    startProctoring();
    if (r.resumed) toast('Welcome back — your saved answers were restored. The timer kept running.', 4500);
    applyControl(r, true);
  } catch (e) {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    b.disabled = false; b.textContent = 'Start exam';
    showErr('#e3', e.message);
  }
}

function localKey() { return 'acri_ans_' + S.attemptId; }
function readLocal() { try { return JSON.parse(localStorage.getItem(localKey()) || '{}'); } catch (e) { return {}; } }
function writeLocal() { try { localStorage.setItem(localKey(), JSON.stringify(S.answers)); } catch (e) {} }

function isAnswered(q) { const v = S.answers[q.id]; return q.type === 'MCQ' ? (v !== undefined && v !== null && v !== '') : !!String(v || '').trim(); }

function renderPalette() {
  $('#pgrid').innerHTML = S.questions.map((q, i) => `<button class="${isAnswered(q) ? 'ans' : ''} ${S.flags[q.id] ? 'flag' : ''} ${i === S.cur ? 'cur' : ''}" data-i="${i}">${i + 1}</button>`).join('');
  $('#pgrid').querySelectorAll('button').forEach(b => b.onclick = () => { S.cur = +b.dataset.i; renderQuestion(); renderPalette(); });
  const a = S.questions.filter(isAnswered).length;
  $('#cnt').textContent = a + ' of ' + S.questions.length + ' answered';
}

function renderQuestion() {
  const q = S.questions[S.cur], n = S.questions.length;
  let body;
  if (q.type === 'MCQ') {
    body = q.options.map((o, i) => `<label class="opt ${String(S.answers[q.id]) === String(i) ? 'sel' : ''}"><input type="radio" name="o" value="${i}" ${String(S.answers[q.id]) === String(i) ? 'checked' : ''}><span class="L">${String.fromCharCode(65 + i)}</span><span>${esc(o)}</span></label>`).join('')
      + `<button class="btn ghost" id="clr" style="margin-top:6px;padding:7px 12px;font-size:13px">Clear choice</button>`;
  } else {
    body = `<textarea class="ans" id="ta" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Type your answer here…">${esc(S.answers[q.id] || '')}</textarea><div class="wc" id="wc"></div>`;
  }
  $('#qpane').innerHTML = `<div class="qcard">
    <div class="qhead"><span class="qnum">Question ${S.cur + 1} of ${n}</span><span class="chip">${q.type === 'MCQ' ? 'Multiple choice' : 'Written answer'}</span><span class="chip g">${q.marks} mark${q.marks == 1 ? '' : 's'}</span></div>
    <div class="qtext">${esc(q.text)}</div>${body}
    <div class="qnav">
      <button class="btn ghost" id="prev" ${S.cur === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="btn ghost" id="flag">${S.flags[q.id] ? '★ Marked for review' : '☆ Mark for review'}</button>
      <div class="spacer"></div>
      ${S.cur < n - 1 ? '<button class="btn" id="next">Save &amp; next →</button>' : '<button class="btn green" id="fin">Review &amp; submit</button>'}
    </div></div>`;
  if (q.type === 'MCQ') {
    $('#qpane').querySelectorAll('input[name=o]').forEach(r => r.onchange = () => {
      setAnswer(q.id, Number(r.value));
      $('#qpane').querySelectorAll('.opt').forEach(l => l.classList.toggle('sel', l.querySelector('input').checked));
    });
    $('#clr').onclick = () => { delete S.answers[q.id]; S.dirty = true; writeLocal(); renderQuestion(); renderPalette(); };
  } else {
    const ta = $('#ta'), wc = () => { const w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; $('#wc').textContent = w + ' word' + (w === 1 ? '' : 's'); };
    ta.addEventListener('input', () => { setAnswer(q.id, ta.value, true); wc(); });
    wc(); ta.focus();
  }
  $('#prev').onclick = () => { S.cur--; renderQuestion(); renderPalette(); };
  $('#flag').onclick = () => { S.flags[q.id] = !S.flags[q.id]; renderQuestion(); renderPalette(); };
  if ($('#next')) $('#next').onclick = () => { S.cur++; renderQuestion(); renderPalette(); };
  if ($('#fin')) $('#fin').onclick = confirmSubmit;
  $('#qpane').scrollTop = 0;
}

function setAnswer(id, v, quiet) {
  S.answers[id] = v; S.dirty = true; writeLocal();
  if (!quiet) renderPalette();
  else { clearTimeout(setAnswer.t); setAnswer.t = setTimeout(renderPalette, 600); }
}

function tickTimer() {
  if (S.ended) return;
  if (S.paused) {
    const tp = $('#timer');
    if (tp) { tp.textContent = fmtDur(Math.floor(S.pause.remaining / 1000)); tp.className = 'timer paused'; tp.title = 'Paused — time frozen'; }
    clearTimeout(tickTimer.t); tickTimer.t = setTimeout(tickTimer, 500);
    return;
  }
  const left = Math.max(0, Math.floor((S.deadline - now()) / 1000));
  const t = $('#timer');
  if (t) { t.textContent = fmtDur(left); t.className = 'timer' + (left <= 60 ? ' crit' : left <= 300 ? ' warn' : ''); }
  if (left <= 300 && !S.warned5 && left > 60) { S.warned5 = true; toast('5 minutes left.', 3500); }
  if (left <= 60 && !S.warned1) { S.warned1 = true; toast('1 minute left — your exam submits automatically.', 4000); }
  if (left <= 0 && S.running) return submitExam('Auto-submitted: time over');
  clearTimeout(tickTimer.t); tickTimer.t = setTimeout(tickTimer, 500);
}

function updateViol() {
  const b = $('#vb'); if (!b) return;
  const m = S.exam.maxWarnings;
  b.textContent = S.violations + (m ? ' / ' + m : '') + ' warning' + (S.violations === 1 && !m ? '' : 's');
  b.classList.toggle('bad', S.violations > 0);
}

/* ---------- proctoring ---------- */

function startProctoring() {
  S.running = true;
  logInfo('EXAM_OPENED', (S.exam.camera ? 'camera ' : '') + (S.exam.screen ? 'screen ' : '') + (S.exam.fullscreen ? 'fullscreen' : ''));
  try { if (window.screen && window.screen.isExtended) logInfo('EXTENDED_DISPLAY', 'More than one display connected'); } catch (e) {}
  scheduleTick(1500);
  if (S.exam.camera || S.exam.screen) {
    setTimeout(() => sendSnap('Exam start'), 3000);
    S.snapT = setInterval(() => sendSnap('Periodic'), S.snapshotSeconds * 1000);
  }
}

function scheduleTick(ms) {
  clearTimeout(S.tickT);
  let d = (S.exam.live && S.watch ? S.liveSeconds : S.hbSeconds) * 1000;   // fast only while a proctor is looking
  if (S.paused) d = (S.pause.eta && S.pause.eta - now() < 6 * 60000) ? 10000 : 25000;
  S.tickT = setTimeout(doTick, ms != null ? ms : d);
}

async function doTick() {
  if (S.ended) return;
  const body = { attemptId: S.attemptId, token: S.token, lat: S.lastLat, fails: S.fails };
  if (S.exam.live && S.watch && !S.paused) {
    if (P.cam) body.cam = await grab('cam', 220, 0.5);
    if (P.scr) body.scr = await grab('scr', 640, 0.45);
  }
  const sentDraft = S.dirty;
  if (sentDraft) { body.draft = S.answers; S.dirty = false; }
  const t0 = Date.now();
  try {
    const r = await api('tick', body);
    S.lastLat = Date.now() - t0; S.fails = 0;
    $('#net') && ($('#net').style.display = 'none');
    if (typeof r.violations === 'number' && r.violations > S.violations) { S.violations = r.violations; updateViol(); }
    if (r.status && r.status !== 'In Progress') return serverEnded(r.status);
    applyControl(r);
  } catch (e) {
    S.fails++;
    if (sentDraft) S.dirty = true;
    if (/another window/i.test(e.message)) return serverEnded('Moved', e.message);
    $('#net') && ($('#net').style.display = 'inline');
  }
  scheduleTick();
}

async function grab(kind, maxW, q) {
  const stream = kind === 'cam' ? P.cam : P.scr, v = kind === 'cam' ? P.camV : P.scrV;
  if (!liveTrack(stream)) return '';
  let src = null, w = 0, h = 0;
  if (document.hidden && 'ImageCapture' in window) {
    try { const bmp = await new ImageCapture(stream.getVideoTracks()[0]).grabFrame(); src = bmp; w = bmp.width; h = bmp.height; } catch (e) {}
  }
  if (!src) { if (!v || !v.videoWidth) return ''; src = v; w = v.videoWidth; h = v.videoHeight; }
  const sc = Math.min(1, maxW / w), c = P.canvas;
  c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  let qq = q, url = c.toDataURL('image/jpeg', qq);
  while (url.length > 95000 && qq > 0.2) { qq -= 0.1; url = c.toDataURL('image/jpeg', qq); }
  return url.length > 98000 ? '' : url;
}

async function sendSnap(reason) {
  if (!S.running && reason !== 'Final') return;
  if (S.paused && reason !== 'Final') return;
  if (Date.now() - S.lastSnap < 1000) return;
  S.lastSnap = Date.now();
  const cam = S.exam.camera ? await grab('cam', 360, 0.6) : '';
  const scr = S.exam.screen ? await grab('scr', 1100, 0.5) : '';
  if (!cam && !scr) return;
  api('snapshot', { attemptId: S.attemptId, token: S.token, cam, scr, reason }).catch(() => {});
}

function logInfo(type, detail) {
  const t = Date.now();
  if (S.lastInfo[type] && t - S.lastInfo[type] < 10000) return;
  S.lastInfo[type] = t;
  api('logEvent', { attemptId: S.attemptId, token: S.token, type, detail: detail || '' }).catch(() => {});
}

const VMSG = {
  TAB_HIDDEN: 'You switched away from the exam tab.',
  WINDOW_BLUR: 'The exam window lost focus (another app or window was used).',
  FULLSCREEN_EXIT: 'You left fullscreen mode.',
  SCREEN_SHARE_STOPPED: 'Screen sharing stopped.',
  CAMERA_STOPPED: 'Your camera stopped.'
};

function violation(type, detail) {
  if (!S.running || S.suspendFocus || S.paused || Date.now() < S.graceUntil) return;
  const t = Date.now();
  if (S.lastViol[type] && t - S.lastViol[type] < 3000) return;
  S.lastViol[type] = t;
  S.violations++; updateViol();
  api('logEvent', { attemptId: S.attemptId, token: S.token, type, detail: detail || '' })
    .then(r => { if (r.violations > S.violations) { S.violations = r.violations; updateViol(); } }).catch(() => {});
  sendSnap('Warning: ' + type);
  setTimeout(() => { S.lastSnap = 0; sendSnap('After ' + type); }, 1800);
  if (S.exam.maxWarnings && S.violations >= S.exam.maxWarnings) {
    return submitExam('Auto-submitted: reached ' + S.exam.maxWarnings + ' proctoring warnings');
  }
  S.pendingWarn = type;
  if (!document.hidden && document.hasFocus()) showWarning();
}

function showWarning() {
  const type = S.pendingWarn; if (!type) return;
  S.pendingWarn = null;
  if (blockers().length) return showBlock();
  const m = S.exam.maxWarnings;
  overlay(`<div class="ic r">!</div><h2>Warning ${S.violations}${m ? ' of ' + m : ''}</h2>
    <p>${esc(VMSG[type] || 'Unusual activity was detected.')} This has been recorded and a snapshot was taken.${m ? ' At ' + m + ' warnings your exam is submitted automatically.' : ''}</p>
    <div class="row"><button class="btn" id="okw">Return to exam</button></div>`);
  $('#okw').onclick = closeOverlay;
}

function blockers() {
  const x = S.exam, b = [];
  if (!S.running || S.paused) return b;
  if (x.fullscreen && !document.fullscreenElement) b.push('fullscreen');
  if (x.screen && !liveTrack(P.scr)) b.push('screen');
  if (x.camera && !liveTrack(P.cam)) b.push('camera');
  return b;
}

function showBlock() {
  const b = blockers(), shell = $('#shell');
  if (!b.length) { shell && shell.classList.remove('blocked'); closeOverlay(); return; }
  shell && shell.classList.add('blocked');
  const k = b[0];
  const txt = {
    fullscreen: ['Return to fullscreen', 'The exam must stay in fullscreen. Leaving fullscreen was recorded as a warning.', 'Return to fullscreen'],
    screen: ['Share your screen again', 'Screen sharing stopped. Share your <b>Entire screen</b> again to continue.', 'Share entire screen'],
    camera: ['Turn your camera back on', 'Your camera stopped. Turn it back on to continue.', 'Turn camera on']
  }[k];
  overlay(`<div class="ic r">!</div><h2>${txt[0]}</h2><p>${txt[1]} The timer keeps running.</p><div class="row"><button class="btn" id="fix">${txt[2]}</button></div><p class="small" id="fixe" style="color:var(--red);margin:10px 0 0"></p>`);
  $('#fix').onclick = async () => {
    if (k === 'fullscreen') { try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) { $('#fixe').textContent = 'Fullscreen was blocked. Try again.'; return; } }
    if (k === 'screen') { if (!(await enableScreen())) { $('#fixe').textContent = 'Please choose "Entire screen".'; return; } logInfo('SCREEN_SHARE_RESUMED', ''); }
    if (k === 'camera') { if (!(await enableCamera())) { $('#fixe').textContent = 'Camera is still blocked. Allow it from the address bar.'; return; } logInfo('CAMERA_RESUMED', ''); }
    showBlock();
  };
}

function mediaLost(kind) {
  if (!S.running) return;
  violation(kind === 'camera' ? 'CAMERA_STOPPED' : 'SCREEN_SHARE_STOPPED', kind + ' track ended');
  if (S.running) showBlock();
}

document.addEventListener('fullscreenchange', () => {
  if (!S.running || !S.exam || !S.exam.fullscreen) return;
  if (!document.fullscreenElement) { violation('FULLSCREEN_EXIT', 'Left fullscreen'); if (S.running) showBlock(); }
  else showBlock();
});

document.addEventListener('visibilitychange', () => {
  if (!S.running) return;
  if (document.hidden) violation('TAB_HIDDEN', 'Exam tab hidden');
  else { if (S.pendingWarn) showWarning(); else if (blockers().length) showBlock(); }
});

window.addEventListener('blur', () => {
  if (!S.running || S.suspendFocus) return;
  setTimeout(() => { if (S.running && !document.hidden && !document.hasFocus() && !S.suspendFocus) violation('WINDOW_BLUR', 'Window lost focus'); }, 400);
});
window.addEventListener('focus', () => { if (S.running && S.pendingWarn) showWarning(); });

/* ---------- copy / paste / shortcut blocking ---------- */

function blocked(what, combo) {
  if (!S.running) return;
  toast(what + ' is disabled during the exam.');
  logInfo(what === 'Copy and paste' ? 'CLIPBOARD_BLOCKED' : (what === 'Right-click' ? 'RIGHT_CLICK' : 'SHORTCUT_BLOCKED'), combo || '');
}
['copy', 'cut', 'paste'].forEach(ev => document.addEventListener(ev, e => { if (S.running) { e.preventDefault(); blocked('Copy and paste', ev); } }, true));
document.addEventListener('contextmenu', e => { if (S.running) { e.preventDefault(); blocked('Right-click'); } }, true);
['dragstart', 'drop'].forEach(ev => document.addEventListener(ev, e => { if (S.running) e.preventDefault(); }, true));
document.addEventListener('beforeinput', e => { if (S.running && /insertFromPaste|insertFromDrop|insertFromYank|insertReplacementText/.test(e.inputType || '')) { e.preventDefault(); blocked('Copy and paste', e.inputType); } }, true);
document.addEventListener('keydown', e => {
  if (!S.running) return;
  const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
  const bad = (mod && 'acvxpsufghjiornwtdklebm'.indexOf(k) >= 0 && k.length === 1)
    || ['f1', 'f3', 'f5', 'f6', 'f7', 'f11', 'f12', 'printscreen', 'contextmenu'].indexOf(k) >= 0
    || (e.altKey && ['arrowleft', 'arrowright', 'home', 'f4', 'tab', 'd'].indexOf(k) >= 0)
    || (mod && e.shiftKey);
  if (bad) {
    e.preventDefault(); e.stopPropagation();
    blocked('That shortcut', (e.ctrlKey ? 'Ctrl+' : '') + (e.metaKey ? 'Cmd+' : '') + (e.altKey ? 'Alt+' : '') + (e.shiftKey ? 'Shift+' : '') + e.key);
  }
}, true);
document.addEventListener('keyup', e => {
  if (S.running && (e.key || '').toLowerCase() === 'printscreen') {
    try { navigator.clipboard.writeText(' '); } catch (x) {}
    logInfo('PRINTSCREEN', 'Print Screen pressed');
  }
}, true);

window.addEventListener('beforeunload', e => { if (S.running) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('pagehide', () => {
  if (!S.running) return;
  try { navigator.sendBeacon(API_URL, new Blob([JSON.stringify({ action: 'tick', attemptId: S.attemptId, token: S.token, draft: S.answers })], { type: 'text/plain' })); } catch (e) {}
});

/* ---------- submit ---------- */

function confirmSubmit() {
  const a = S.questions.filter(isAnswered).length, n = S.questions.length, f = S.questions.filter(q => S.flags[q.id]).length;
  overlay(`<div class="ic b">?</div><h2>Submit your exam?</h2>
    <p>You answered <b>${a} of ${n}</b> questions${n - a ? ` — <b style="color:var(--red)">${n - a} unanswered</b>` : ''}${f ? `, ${f} marked for review` : ''}. You cannot change your answers after submitting.</p>
    <div class="row"><button class="btn ghost" id="cn">Keep working</button><button class="btn green" id="cy">Submit now</button></div>`);
  $('#cn').onclick = closeOverlay;
  $('#cy').onclick = () => submitExam('Submitted by student');
}

async function submitExam(reason) {
  if (S.submitting || S.ended) return;
  S.submitting = true;
  sendSnap('Final');
  S.running = false;
  clearTimeout(S.tickT); clearInterval(S.snapT);
  overlay(`<div class="spin dk"></div><h2 style="margin-top:14px">Submitting…</h2><p id="subm">${esc(reason)}</p>`);
  let tries = 0;
  for (;;) {
    try { await api('submit', { attemptId: S.attemptId, token: S.token, answers: S.answers, reason }); break; }
    catch (e) {
      if (/another window|not found/i.test(e.message)) { return finish('error', e.message); }
      tries++;
      const el = $('#subm'); if (el) el.innerHTML = 'Connection problem — retrying (' + tries + ')… <b>Do not close this tab.</b> Your answers are saved on this device.';
      await sleep(Math.min(15000, 2000 * tries));
    }
  }
  finish('ok');
}

function serverEnded(status, msg) {
  if (S.ended) return;
  S.running = false;
  if (status === 'Moved') return finish('error', msg);
  if (status === 'Voided') return finish('error', 'This attempt was cancelled by the Controller of Examinations.');
  finish('ok', 'Your exam has been submitted.');
}

function finish(kind, msg) {
  S.ended = true; S.running = false; S.paused = false;
  clearInterval(S.pauseT); $('#pv').classList.remove('on');
  clearTimeout(S.tickT); clearInterval(S.snapT); clearTimeout(tickTimer.t);
  [P.cam, P.scr].forEach(s => s && s.getTracks().forEach(t => t.stop()));
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (kind === 'ok') { try { localStorage.removeItem(localKey()); } catch (e) {} }
  closeOverlay();
  const st = BOOT.student;
  $('#app').innerHTML = header() + `<main class="wrap narrow"><div class="card" style="text-align:center;padding:40px 26px">
    <div class="ic ${kind === 'ok' ? 'g' : 'r'}">${kind === 'ok' ? '✓' : '!'}</div>
    <h2 style="margin-top:14px;font-size:24px">${kind === 'ok' ? 'Exam submitted' : 'Exam closed in this window'}</h2>
    <p class="muted">${esc(msg || 'Thank you, ' + st.name + '. Your answers for "' + S.exam.title + '" have been received.')}</p>
    ${kind === 'ok' ? `<p class="small muted">${S.rollNo ? 'Roll No. <b>' + esc(S.rollNo) + '</b> · ' : ''}Attempt ID: <b>${esc(S.attemptId)}</b><br>Your grade card will be emailed to ${esc(st.email)} after it is reviewed and verified.</p>` : ''}
    <p class="small muted" style="margin-top:20px">You can now close this tab.</p></div></main>`;
}

/* ---------- system pause (Master Control) ---------- */

function applyControl(r, first) {
  if (r.deadline) S.deadline = r.deadline;
  if ('watch' in r) S.watch = !!r.watch;
  if (r.notice && r.notice.id && r.notice.id !== S.lastNotice) {
    const seen = S.lastNotice; S.lastNotice = r.notice.id;
    if (!first || seen) toast(r.notice.text, 7000);
  }
  if (r.paused) {
    const was = S.paused;
    S.paused = true;
    S.pause = { at: r.pausedAt, eta: r.eta || 0, remaining: r.remaining, message: r.pauseMessage || '', manual: !!r.manual, alarmed: was && S.pause ? S.pause.alarmed : false };
    if (!was) enterPause(); else drawPause();
  } else if (S.paused) leavePause(r);
}

function enterPause() {
  closeOverlay();
  $('#shell') && $('#shell').classList.add('blocked');
  $('#pv').classList.add('on');
  drawPause();
  clearInterval(S.pauseT);
  S.pauseT = setInterval(drawPause, 1000);
  logInfo('PAUSE_SHOWN', S.pause.manual ? 'Manual pause' : 'Auto pause');
  scheduleTick();
}

function drawPause() {
  if (!S.paused) return;
  const p = S.pause, t = now();
  const since = Math.max(0, Math.floor((t - p.at) / 1000));
  const toEta = p.eta ? Math.max(0, Math.floor((p.eta - t) / 1000)) : -1;
  const soon = toEta >= 0 && toEta <= 300;
  if (soon && !p.alarmed) { p.alarmed = true; siren(5); flashTitle('⏰ Return to your exam'); }
  const etaClock = p.eta ? new Date(p.eta).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' }) : '';
  $('#pv').innerHTML = `<div class="pvb">
    <img src="${EMBLEM}" alt="ACRI">
    <div class="eb">Exam paused · ${esc(S.exam.title)}</div>
    <h1>Please ask your examiner to take you to the supervision room.</h1>
    <p class="lead">${p.manual ? 'The Controller of Examinations has paused your exam for a short while.' : 'The examination system is very busy, so your exam has been paused for a short while.'} <b style="color:#fff">Your timer is frozen — you will not lose any time.</b></p>
    <div class="pvs">
      <div><span>Paused for</span><b>${fmtDur(since)}</b><small>since ${new Date(p.at).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' })} IST</small></div>
      <div><span>Your time left</span><b>${fmtDur(Math.floor(p.remaining / 1000))}</b><small>frozen until you resume</small></div>
      <div><span>Expected to resume</span><b>${toEta >= 0 ? fmtDur(toEta) : '—'}</b><small>${p.eta ? 'about ' + etaClock + ' IST · may be sooner' : 'as soon as there is room'}</small></div>
    </div>
    <div class="pvn ${soon ? 'alert' : ''}"><b style="font-size:20px">${soon ? '⏰' : '🔔'}</b><div>${soon
      ? '<b>Your exam resumes in about ' + fmtDur(toEta) + '. Come back to this screen now.</b> It may resume at any moment.'
      : '<b>An alarm will sound 5 minutes before your exam resumes, and again when it resumes.</b> It can resume earlier than expected, so stay within hearing distance of this computer.'}</div></div>
    ${p.message ? `<div class="pvm"><b>Message from the Controller of Examinations:</b> ${esc(p.message)}</div>` : ''}
    <div class="pvf">Do not close this tab or turn off the computer. Your answers are saved. Proctoring warnings are not counted while the exam is paused.</div>
  </div>`;
}

function leavePause(r) {
  const addedMin = S.pause ? Math.round((S.deadline - now() - S.pause.remaining) / 60000) : 0;
  S.paused = false; S.pause = null;
  clearInterval(S.pauseT);
  $('#pv').classList.remove('on');
  $('#shell') && $('#shell').classList.remove('blocked');
  S.graceUntil = Date.now() + 60000;
  siren(4); flashTitle('▶ Exam resumed');
  logInfo('PAUSE_ENDED', 'Resumed');
  if (!r.notice) toast('Your exam has resumed.' + (addedMin > 0 ? ' ' + addedMin + ' minute(s) were added to your time.' : ''), 6000);
  showBlock();
  scheduleTick(1000);
}

function unlockAudio() {
  try { if (!S.audio) S.audio = new (window.AudioContext || window.webkitAudioContext)(); if (S.audio.state === 'suspended') S.audio.resume(); } catch (e) {}
}

function siren(sec) {
  try {
    unlockAudio();
    const ctx = S.audio; if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = 'square';
    for (let i = 0; i < sec * 2.5; i++) o.frequency.setValueAtTime(i % 2 ? 960 : 640, t + i * 0.4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.05);
    g.gain.setValueAtTime(0.22, t + sec - 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sec);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + sec + 0.05);
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
}

function flashTitle(text) {
  const orig = S.exam ? S.exam.title + ' — ACRI Examination' : document.title;
  let n = 0;
  clearInterval(flashTitle.t);
  flashTitle.t = setInterval(() => { document.title = n % 2 ? orig : text; if (++n > 20) { clearInterval(flashTitle.t); document.title = orig; } }, 700);
}

/* ---------- start ---------- */
if (API_URL.indexOf('PASTE_') === 0) document.addEventListener('DOMContentLoaded', () => toast('Setup needed: paste the Apps Script /exec URL into API_URL.', 6000));
if (BOOT) secureTab(); else landing();
</script>
</body>
